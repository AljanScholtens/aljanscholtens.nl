{{ define "main" }}

<div class="l-wrapper">
  <article class="l-container">
    <div class="l-single-wide">
      <div class="c-card-grid">
        {{ range .Paginator.Pages }}
          {{ partial "article-card.html" (dict "page" .) }}
        {{ end }}
      </div>

      {{ partial "pagination.html" .Paginator }}
    </div>
  </article>
</div>

{{ end }}
